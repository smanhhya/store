name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Web Files and Capacitor Config
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          find . -maxdepth 1 -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.svg" -o -name "*.ico" -o -name "manifest.json" \) -exec cp {} www/ \; || true
          if [ ! -f "www/index.html" ]; then
            echo "ERROR: index.html not found in root or www/ folder!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "sman-crm-app",
              version: "1.0.0",
              dependencies: {
                "@capacitor/core": "6.2.0",
                "@capacitor/android": "6.2.0"
              },
              devDependencies: {
                "@capacitor/cli": "6.2.0"
              }
            }, null, 2));
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.smanhehya.crm",
              appName: "سمان ههيا CRM",
              webDir: "www",
              server: {
                androidScheme: "https",
                cleartext: true
              },
              android: {
                allowMixedContent: true
              }
            }, null, 2));
          '

      - name: Install Dependencies & Add Android
        run: |
          rm -rf node_modules package-lock.json android
          npm install
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sman-CRM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
