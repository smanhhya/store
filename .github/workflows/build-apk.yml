name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          if [ ! -d "$ANDROID_SDK/platforms/android-34" ]; then
            SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -f "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_SDK" -name sdkmanager -type f | head -n 1)
            fi
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Prepare Unified Signing Keystore (For Seamless App Updates)
        run: |
          mkdir -p ~/.android
          if [ ! -f "sman-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore sman-debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sman-debug.keystore
            git commit -m "chore: add persistent signing keystore for seamless APK updates [skip ci]" || true
            git push || true
          fi
          cp -f sman-debug.keystore ~/.android/debug.keystore

      - name: Prepare Web Files and Capacitor Config
        run: |
          mkdir -p www
          mkdir -p www/www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.svg" -o -name "*.ico" \) ! -name "package.json" ! -name "package-lock.json" ! -name "capacitor.config.json" -exec cp -u {} www/ \; || true
          cp -f www/*.js www/www/ 2>/dev/null || true
          if [ ! -f "www/index.html" ]; then
            echo "ERROR: index.html not found in root or www/ folder!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "sman-crm-app",
              version: "1.0.0",
              dependencies: {
                "@capacitor/core": "6.2.0",
                "@capacitor/android": "6.2.0"
              },
              devDependencies: {
                "@capacitor/cli": "6.2.0"
              }
            }, null, 2));
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.smanhehya.crm",
              appName: "سمان ههيا CRM",
              webDir: "www",
              server: {
                androidScheme: "https",
                cleartext: true
              },
              android: {
                allowMixedContent: true
              }
            }, null, 2));
          '

      - name: Install Dependencies & Add Android (Anti-Timeout & Auto-Version)
        run: |
          rm -rf node_modules package-lock.json android
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 120000
          npm install
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          cp -f sman-debug.keystore android/app/debug.keystore || true
          cp -f sman-debug.keystore ~/.android/debug.keystore || true

          RUN_NUM="${{ github.run_number }}"
          VER_CODE=$((1000 + RUN_NUM))
          node -e "
            const fs = require('fs');
            const gradlePath = 'android/app/build.gradle';
            if (fs.existsSync(gradlePath)) {
              let g = fs.readFileSync(gradlePath, 'utf8');
              g = g.replace(/versionCode\s+\d+/, 'versionCode ' + $VER_CODE);
              g = g.replace(/versionName\s+\"[^\"]+\"/, 'versionName \"1.0.' + $RUN_NUM + '\"');
              fs.writeFileSync(gradlePath, g, 'utf8');
            }
          "

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          cat << 'EOG' >> android/gradle.properties
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          EOG

      - name: Inject Native Deli E750W Bridge + Smart Back Navigation + Keep-Alive State
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
            `;
            if (!xml.includes("BLUETOOTH_CONNECT")) {
              xml = xml.replace("<application", perms + "\n    <application");
            }
            if (!xml.includes("enableOnBackInvokedCallback")) {
              xml = xml.replace("<application", "<application android:enableOnBackInvokedCallback=\"false\"");
            }
            if (!xml.includes("alwaysRetainTaskState")) {
              xml = xml.replace("<activity", "<activity android:alwaysRetainTaskState=\"true\"");
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

          cat << 'EOF' > android/app/src/main/java/com/smanhehya/crm/MainActivity.java
          package com.smanhehya.crm;

          import android.Manifest;
          import android.app.PendingIntent;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.view.KeyEvent;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Set;
          import java.util.UUID;

          public class MainActivity extends BridgeActivity {
              private long lastBackPressTime = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          final WebView webView = this.bridge.getWebView();
                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);

                          webView.addJavascriptInterface(new SmanPrinterBridge(this, webView), "SmanNativePrinter");
                          webView.reload();

                          // حقن نظام تتبع الصفحات وحفظ آخر صفحة مفتوحة بعد تحميل الواجهة
                          webView.postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  injectSmartNavigationTracker(webView);
                              }
                          }, 1200);
                      }

                      // التقاط زر الرجوع وإيماءة السحب في أندرويد لإرجاع المستخدم للصفحة السابقة
                      getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              handleSmartBackAction();
                          }
                      });
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          injectSmartNavigationTracker(this.bridge.getWebView());
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (event.getAction() == KeyEvent.ACTION_UP) {
                          handleSmartBackAction();
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              private void injectSmartNavigationTracker(final WebView webView) {
                  String trackerJs = "(function(){" +
                      "window.SMAN_OWNER_TRUSTED_APK = true;" +
                      "if(window._smanNativeNavInstalled) return;" +
                      "window._smanNativeNavInstalled = true;" +
                      "window._smanTabHistory = window._smanTabHistory || [];" +
                      "var activeEl = document.querySelector('.view-section.active');" +
                      "window._smanCurrentTabId = activeEl && activeEl.id ? activeEl.id.replace('view-','') : 'orders';" +
                      "if(typeof window.switchTab === 'function'){" +
                      "  var origSwitch = window.switchTab;" +
                      "  window.switchTab = function(tabId, btnEl, isBack){" +
                      "    if(!isBack && window._smanCurrentTabId && window._smanCurrentTabId !== tabId){" +
                      "      window._smanTabHistory.push(window._smanCurrentTabId);" +
                      "      if(window._smanTabHistory.length > 30) window._smanTabHistory.shift();" +
                      "    }" +
                      "    window._smanCurrentTabId = tabId;" +
                      "    try{ localStorage.setItem('sman_last_open_tab', tabId); }catch(e){}" +
                      "    return origSwitch.apply(this, arguments);" +
                      "  };" +
                      "}" +
                      "try{" +
                      "  var savedTab = localStorage.getItem('sman_last_open_tab');" +
                      "  if(savedTab && savedTab !== 'orders' && !window._smanRestoredInitialTab){" +
                      "    window._smanRestoredInitialTab = true;" +
                      "    var btn = document.querySelector('#sidebar button[onclick*=\"switchTab(\\'' + savedTab + '\\'\"]');" +
                      "    if(btn && typeof window.switchTab === 'function') window.switchTab(savedTab, btn, true);" +
                      "  }" +
                      "}catch(e){}" +
                      "})();";
                  webView.evaluateJavascript(trackerJs, null);
              }

              private void handleSmartBackAction() {
                  try {
                      if (this.bridge == null || this.bridge.getWebView() == null) {
                          moveTaskToBack(true);
                          return;
                      }
                      final WebView webView = this.bridge.getWebView();
                      String backScript = "(function(){" +
                          "if(typeof window.handleAndroidBackButton === 'function'){" +
                          "  var r = window.handleAndroidBackButton();" +
                          "  if(r === 'HANDLED') return 'HANDLED';" +
                          "}" +
                          "var pop = document.getElementById('lc-floating-popover');" +
                          "if(pop && !pop.classList.contains('hidden')){ pop.classList.add('hidden'); return 'HANDLED'; }" +
                          "var alerts = document.getElementById('lc-alerts-dropdown');" +
                          "if(alerts && !alerts.classList.contains('hidden')){ alerts.classList.add('hidden'); return 'HANDLED'; }" +
                          "var prnModal = document.getElementById('deli-waybill-studio-modal');" +
                          "if(prnModal && !prnModal.classList.contains('hidden')){ prnModal.classList.add('hidden'); return 'HANDLED'; }" +
                          "var modals = Array.from(document.querySelectorAll('[id$=\"-modal\"]:not(.hidden), .modal-backdrop:not(.hidden)'));" +
                          "if(modals.length > 0){" +
                          "  var topM = modals[modals.length - 1];" +
                          "  if(typeof window.closeModal === 'function' && topM.id) window.closeModal(topM.id);" +
                          "  else topM.classList.add('hidden');" +
                          "  return 'HANDLED';" +
                          "}" +
                          "var sbOverlay = document.getElementById('sidebar-overlay');" +
                          "if(sbOverlay && !sbOverlay.classList.contains('hidden')){" +
                          "  if(typeof window.toggleSidebar === 'function') window.toggleSidebar();" +
                          "  else sbOverlay.classList.add('hidden');" +
                          "  return 'HANDLED';" +
                          "}" +
                          "if(window._smanTabHistory && window._smanTabHistory.length > 0){" +
                          "  var prevTab = window._smanTabHistory.pop();" +
                          "  if(prevTab && typeof window.switchTab === 'function'){" +
                          "    var b = document.querySelector('#sidebar button[onclick*=\"switchTab(\\'' + prevTab + '\\'\"]');" +
                          "    window.switchTab(prevTab, b, true);" +
                          "    return 'HANDLED';" +
                          "  }" +
                          "}" +
                          "var curView = document.querySelector('.view-section.active');" +
                          "var curId = curView && curView.id ? curView.id.replace('view-','') : 'orders';" +
                          "if(curId !== 'orders' && typeof window.switchTab === 'function'){" +
                          "  var ordBtn = document.querySelector('#sidebar button[onclick*=\"switchTab(\\'orders\\'\"]');" +
                          "  window.switchTab('orders', ordBtn, true);" +
                          "  return 'HANDLED';" +
                          "}" +
                          "if(curId === 'orders' && typeof currentOrderTab !== 'undefined' && currentOrderTab !== 'all' && typeof window.setOrderTab === 'function'){" +
                          "  window.setOrderTab('all');" +
                          "  return 'HANDLED';" +
                          "}" +
                          "return 'AT_ROOT';" +
                          "})()";

                      webView.evaluateJavascript(backScript, new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String value) {
                              String clean = value != null ? value.replace("\"", "").trim() : "";
                              if ("HANDLED".equals(clean)) {
                                  return;
                              }
                              if (webView.canGoBack()) {
                                  webView.goBack();
                                  return;
                              }
                              long now = System.currentTimeMillis();
                              if (now - lastBackPressTime < 2200) {
                                  // إبقاء التطبيق حياً في الخلفية بدلاً من قتله حتى يفتح فوراً دون بدء من الصفر
                                  moveTaskToBack(true);
                              } else {
                                  lastBackPressTime = now;
                                  Toast.makeText(MainActivity.this, "اضغط رجوع مرة أخرى لتصغير التطبيق", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  } catch (Exception e) {
                      moveTaskToBack(true);
                  }
              }

              public static class SmanPrinterBridge {
                  private final MainActivity activity;
                  private final WebView webView;
                  private static final UUID SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
                  private static final String ACTION_USB_PERMISSION = "com.smanhehya.crm.USB_PERMISSION";
                  private static final String PREFS_NAME = "SmanOwnerPermanentPrefs";

                  public SmanPrinterBridge(MainActivity activity, WebView webView) {
                      this.activity = activity;
                      this.webView = webView;
                  }

                  @JavascriptInterface
                  public boolean isNativeBridgeReady() {
                      return true;
                  }

                  @JavascriptInterface
                  public void savePermanentPref(String key, String value) {
                      try {
                          SharedPreferences prefs = activity.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          prefs.edit().putString(key, value != null ? value : "").apply();
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public String getPermanentPref(String key) {
                      try {
                          SharedPreferences prefs = activity.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          return prefs.getString(key, "");
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean checkAndRequestPermissions() {
                      try {
                          if (Build.VERSION.SDK_INT >= 31) {
                              List<String> needed = new ArrayList<>();
                              if (ContextCompat.checkSelfPermission(activity, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                                  needed.add(Manifest.permission.BLUETOOTH_CONNECT);
                              }
                              if (ContextCompat.checkSelfPermission(activity, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) {
                                  needed.add(Manifest.permission.BLUETOOTH_SCAN);
                              }
                              if (!needed.isEmpty()) {
                                  ActivityCompat.requestPermissions(activity, needed.toArray(new String[0]), 7501);
                                  return false;
                              }
                          }
                          return true;
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  @JavascriptInterface
                  public String getPairedDevicesJson() {
                      try {
                          if (!checkAndRequestPermissions()) {
                              return "PERMISSION_REQUIRED";
                          }
                          BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                          if (adapter == null) {
                              return "NO_BLUETOOTH";
                          }
                          if (!adapter.isEnabled()) {
                              try {
                                  Intent enableBtIntent = new Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE);
                                  activity.startActivityForResult(enableBtIntent, 7502);
                              } catch (Exception ignored) {}
                              return "BLUETOOTH_OFF";
                          }
                          Set<BluetoothDevice> paired = adapter.getBondedDevices();
                          JSONArray arr = new JSONArray();
                          if (paired != null) {
                              for (BluetoothDevice dev : paired) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("name", dev.getName() != null ? dev.getName() : "طابعة بلوتوث");
                                  obj.put("address", dev.getAddress());
                                  arr.put(obj);
                              }
                          }
                          return arr.toString();
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }

                  private BluetoothSocket connectBluetoothSocketWithFallback(BluetoothDevice device) throws Exception {
                      BluetoothSocket socket = null;
                      try {
                          socket = device.createRfcommSocketToServiceRecord(SPP_UUID);
                          socket.connect();
                          return socket;
                      } catch (Exception e1) {
                          try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                      }
                      try {
                          socket = device.createInsecureRfcommSocketToServiceRecord(SPP_UUID);
                          socket.connect();
                          return socket;
                      } catch (Exception e2) {
                          try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                      }
                      Method m = device.getClass().getMethod("createRfcommSocket", new Class[]{int.class});
                      socket = (BluetoothSocket) m.invoke(device, 1);
                      socket.connect();
                      return socket;
                  }

                  @JavascriptInterface
                  public String printRawBase64Bluetooth(String macAddress, String base64Data) {
                      BluetoothSocket socket = null;
                      try {
                          if (!checkAndRequestPermissions()) {
                              return "PERMISSION_REQUIRED";
                          }
                          BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                          if (adapter == null || !adapter.isEnabled()) {
                              return "BLUETOOTH_OFF";
                          }
                          try { adapter.cancelDiscovery(); } catch (Exception ignored) {}

                          BluetoothDevice targetDevice = null;
                          if (macAddress != null && !macAddress.trim().isEmpty() && !macAddress.equals("AUTO")) {
                              targetDevice = adapter.getRemoteDevice(macAddress.trim());
                          } else {
                              Set<BluetoothDevice> paired = adapter.getBondedDevices();
                              if (paired != null) {
                                  for (BluetoothDevice dev : paired) {
                                      String nm = (dev.getName() != null ? dev.getName() : "").toLowerCase();
                                      if (nm.contains("deli") || nm.contains("750") || nm.contains("printer") || nm.contains("label") || nm.contains("pos")) {
                                          targetDevice = dev;
                                          break;
                                      }
                                  }
                                  if (targetDevice == null && !paired.isEmpty()) {
                                      targetDevice = paired.iterator().next();
                                  }
                              }
                          }

                          if (targetDevice == null) {
                              return "NO_PAIRED_PRINTER";
                          }

                          byte[] rawBytes = Base64.decode(base64Data, Base64.DEFAULT);
                          socket = connectBluetoothSocketWithFallback(targetDevice);
                          OutputStream os = socket.getOutputStream();

                          int chunkSize = 1024;
                          for (int i = 0; i < rawBytes.length; i += chunkSize) {
                              int len = Math.min(chunkSize, rawBytes.length - i);
                              os.write(rawBytes, i, len);
                              os.flush();
                              Thread.sleep(6);
                          }
                          os.flush();
                          Thread.sleep(350);
                          socket.close();
                          return "OK:" + (targetDevice.getName() != null ? targetDevice.getName() : targetDevice.getAddress());
                      } catch (Exception e) {
                          try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                          return "ERROR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String printRawBase64Usb(String base64Data) {
                      try {
                          UsbManager usbManager = (UsbManager) activity.getSystemService(Context.USB_SERVICE);
                          if (usbManager == null) return "NO_USB_SERVICE";

                          HashMap<String, UsbDevice> deviceList = usbManager.getDeviceList();
                          if (deviceList == null || deviceList.isEmpty()) {
                              return "NO_USB_DEVICE";
                          }

                          UsbDevice printerDevice = deviceList.values().iterator().next();
                          if (!usbManager.hasPermission(printerDevice)) {
                              int flags = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                              PendingIntent pi = PendingIntent.getBroadcast(activity, 0, new Intent(ACTION_USB_PERMISSION), flags);
                              usbManager.requestPermission(printerDevice, pi);
                              return "USB_PERMISSION_REQUESTED";
                          }

                          UsbInterface targetInterface = null;
                          UsbEndpoint targetEndpoint = null;

                          for (int i = 0; i < printerDevice.getInterfaceCount(); i++) {
                              UsbInterface usbIf = printerDevice.getInterface(i);
                              for (int j = 0; j < usbIf.getEndpointCount(); j++) {
                                  UsbEndpoint ep = usbIf.getEndpoint(j);
                                  if (ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.getDirection() == UsbConstants.USB_DIR_OUT) {
                                      targetInterface = usbIf;
                                      targetEndpoint = ep;
                                      break;
                                  }
                              }
                              if (targetEndpoint != null) break;
                          }

                          if (targetInterface == null || targetEndpoint == null) {
                              return "NO_USB_PRINTER_ENDPOINT";
                          }

                          byte[] rawBytes = Base64.decode(base64Data, Base64.DEFAULT);
                          UsbDeviceConnection connection = usbManager.openDevice(printerDevice);
                          if (connection == null) return "USB_OPEN_FAILED";

                          connection.claimInterface(targetInterface, true);
                          int chunkSize = 4096;
                          for (int i = 0; i < rawBytes.length; i += chunkSize) {
                              int len = Math.min(chunkSize, rawBytes.length - i);
                              byte[] chunk = new byte[len];
                              System.arraycopy(rawBytes, i, chunk, 0, len);
                              int transferred = connection.bulkTransfer(targetEndpoint, chunk, len, 4000);
                              if (transferred < 0) {
                                  connection.releaseInterface(targetInterface);
                                  connection.close();
                                  return "USB_TRANSFER_ERROR";
                                }
                          }

                          connection.releaseInterface(targetInterface);
                          connection.close();
                          return "OK:USB";
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public void triggerAndroidSystemPrint(final String jobName) {
                      activity.runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager printManager = (PrintManager) activity.getSystemService(Context.PRINT_SERVICE);
                                  if (printManager != null && webView != null) {
                                      String name = (jobName != null && !jobName.isEmpty()) ? jobName : "Sman_Hehya_Waybill";
                                      PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(name);
                                      printManager.print(name, adapter, new PrintAttributes.Builder().build());
                                  }
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sman-CRM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
