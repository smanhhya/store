name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Unified Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f "sman-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore sman-debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sman-debug.keystore
            git commit -m "chore: add persistent signing keystore [skip ci]" || true
            git push || true
          fi
          cp -f sman-debug.keystore ~/.android/debug.keystore

      - name: Prepare Web Files and Auto-Patch printer.html with Native Bluetooth TSPL
        run: |
          mkdir -p www
          mkdir -p www/www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.svg" -o -name "*.ico" \) ! -name "package.json" ! -name "package-lock.json" ! -name "capacitor.config.json" -exec cp -u {} www/ \; || true
          cp -f www/*.js www/www/ 2>/dev/null || true

          # حقن محرك البلوتوث المباشر لطابعة Deli 750W-S (MAC: A5:A4:00:0A:22:90) داخل printer.html تلقائياً
          node -e '
            const fs = require("fs");
            ["www/printer.html", "printer.html"].forEach(p => {
              if (!fs.existsSync(p)) return;
              let html = fs.readFileSync(p, "utf8");
              if (html.includes("DELI_750WS_DIRECT_INJECTED")) return;
              const patchScript = `
              <script>
              // DELI_750WS_DIRECT_INJECTED (MAC: A5:A4:00:0A:22:90 | Name: 750W-S2290)
              (function() {
                  const DELI_DEFAULT_MAC = "A5:A4:00:0A:22:90";
                  function uint8ToB64(bytes) {
                      let bin = "";
                      for (let i = 0; i < bytes.length; i += 0x8000) {
                          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
                      }
                      return btoa(bin);
                  }
                  async function domStickerToTSPL(stickerEl, dim) {
                      stickerEl.querySelectorAll("svg").forEach(svg => {
                          const r = svg.getBoundingClientRect();
                          if (r.width > 0 && r.height > 0) {
                              svg.setAttribute("width", Math.round(r.width));
                              svg.setAttribute("height", Math.round(r.height));
                          }
                      });
                      const wDots = Math.floor((dim.widthMm || 100) * 8);
                      const hDots = Math.floor((dim.heightMm || 100) * 8);
                      const wBytes = Math.ceil(wDots / 8);
                      const srcCanvas = await html2canvas(stickerEl, { scale: 2.5, backgroundColor: "#ffffff", useCORS: true, logging: false });
                      const cnv = document.createElement("canvas");
                      cnv.width = wDots; cnv.height = hDots;
                      const ctx = cnv.getContext("2d");
                      ctx.fillStyle = "#FFFFFF";
                      ctx.fillRect(0, 0, wDots, hDots);
                      ctx.drawImage(srcCanvas, 0, 0, wDots, hDots);
                      const imgData = ctx.getImageData(0, 0, wDots, hDots).data;
                      const bitmap = new Uint8Array(wBytes * hDots);
                      bitmap.fill(0xFF);
                      for (let y = 0; y < hDots; y++) {
                          for (let x = 0; x < wDots; x++) {
                              const idx = (y * wDots + x) * 4;
                              const lum = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
                              if (lum < 185) bitmap[y * wBytes + Math.floor(x / 8)] &= ~(1 << (7 - (x % 8)));
                          }
                      }
                      const hdr = new TextEncoder().encode([
                          "SIZE " + (dim.widthMm || 100) + " mm," + (dim.heightMm || 100) + " mm",
                          "GAP 2 mm,0 mm",
                          "SPEED 4",
                          "DENSITY 14",
                          "DIRECTION 0,0",
                          "REFERENCE 0,0",
                          "SET TEAR ON",
                          "CLS",
                          "BITMAP 0,0," + wBytes + "," + hDots + ",0,"
                      ].join("\\r\\n"));
                      const ftr = new TextEncoder().encode("\\r\\nPRINT 1,1\\r\\n");
                      const pkt = new Uint8Array(hdr.length + bitmap.length + ftr.length);
                      pkt.set(hdr, 0); pkt.set(bitmap, hdr.length); pkt.set(ftr, hdr.length + bitmap.length);
                      return pkt;
                  }
                  window.addEventListener("load", function() {
                      window.executeDirectPrint = async function() {
                          const stickers = [...document.querySelectorAll("#thermal-print-stage .thermal-sticker")];
                          if (!stickers.length) {
                              if (typeof showToast === "function") showToast("اختر طلباً أو ملصقاً أولاً", "warn");
                              return;
                          }
                          if (!window.SmanNativePrinter) {
                              alert("⚠️ للطباعة المباشرة بدون نوافذ، افتح تطبيق (مطبعة سمان ههيا APK) المثبت على هاتفك.");
                              return;
                          }
                          if (typeof showToast === "function") showToast("⚡ جاري الطباعة المباشرة على Deli 750W-S...");
                          try {
                              if (typeof waitForPrintAssets === "function") await waitForPrintAssets();
                              const dim = typeof getPaperDimensions === "function" ? getPaperDimensions() : { widthMm: 100, heightMm: 100 };
                              let totalLen = 0;
                              const pkts = [];
                              for (let i = 0; i < stickers.length; i++) {
                                  const p = await domStickerToTSPL(stickers[i], dim);
                                  pkts.push(p);
                                  totalLen += p.length;
                              }
                              const combined = new Uint8Array(totalLen);
                              let off = 0;
                              pkts.forEach(p => { combined.set(p, off); off += p.length; });
                              const b64 = uint8ToB64(combined);
                              let res = window.SmanNativePrinter.printRawBase64Bluetooth(DELI_DEFAULT_MAC, b64);
                              if (!String(res).startsWith("OK:")) {
                                  res = window.SmanNativePrinter.printRawBase64Bluetooth("AUTO", b64);
                              }
                              if (String(res).startsWith("OK:")) {
                                  if (typeof showToast === "function") showToast("✅ تمت الطباعة المباشرة على " + String(res).slice(3));
                                  if (typeof openPostPrintModal === "function" && typeof getPrintableSelectedOrders === "function") {
                                      const ords = getPrintableSelectedOrders();
                                      if (ords.length) openPostPrintModal(ords.length);
                                  }
                              } else {
                                  alert("تنبيه الطابعة: " + res + "\\nتأكد أن طابعة 750W-S2290 مفتوحة ومقترنة بالبلوتوث (الرقم السري 0000).");
                              }
                          } catch (err) {
                              alert("خطأ أثناء الطباعة: " + err.message);
                          }
                      };
                  });
              })();
              </script>
              `;
              html = html.replace("</body>", patchScript + "\n</body>");
              fs.writeFileSync(p, html, "utf8");
            });
          '

          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "sman-crm-app",
              version: "1.0.0",
              dependencies: {
                "@capacitor/core": "6.2.0",
                "@capacitor/android": "6.2.0"
              },
              devDependencies: {
                "@capacitor/cli": "6.2.0"
              }
            }, null, 2));
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.smanhehya.crm",
              appName: "سمان ههيا CRM",
              webDir: "www",
              server: {
                androidScheme: "https",
                cleartext: true
              },
              android: {
                allowMixedContent: true
              }
            }, null, 2));
          '

      - name: Install Dependencies & Add Android
        run: |
          rm -rf node_modules package-lock.json android
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 120000
          npm install
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle || true
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/g" android/app/build.gradle || true
          cp -f sman-debug.keystore android/app/debug.keystore || true
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          cat << 'EOG' >> android/gradle.properties
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          EOG

      - name: Inject Native Deli 750W-S (A5:A4:00:0A:22:90) Bluetooth & USB Bridge
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
            `;
            if (!xml.includes("BLUETOOTH_CONNECT")) {
              xml = xml.replace("<application", perms + "\n    <application");
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '

          cat << 'EOF' > android/app/src/main/java/com/smanhehya/crm/MainActivity.java
          package com.smanhehya.crm;

          import android.Manifest;
          import android.app.PendingIntent;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Set;
          import java.util.UUID;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          webView.getSettings().setJavaScriptEnabled(true);
                          webView.addJavascriptInterface(new SmanPrinterBridge(this, webView), "SmanNativePrinter");
                          webView.reload();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static class SmanPrinterBridge {
                  private final MainActivity activity;
                  private final WebView webView;
                  private static final UUID SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
                  private static final String DEFAULT_DELI_MAC = "A5:A4:00:0A:22:90";
                  private static final String ACTION_USB_PERMISSION = "com.smanhehya.crm.USB_PERMISSION";

                  public SmanPrinterBridge(MainActivity activity, WebView webView) {
                      this.activity = activity;
                      this.webView = webView;
                  }

                  @JavascriptInterface
                  public boolean isNativeBridgeReady() {
                      return true;
                  }

                  @JavascriptInterface
                  public boolean checkAndRequestPermissions() {
                      try {
                          if (Build.VERSION.SDK_INT >= 31) {
                              List<String> needed = new ArrayList<>();
                              if (ContextCompat.checkSelfPermission(activity, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                                  needed.add(Manifest.permission.BLUETOOTH_CONNECT);
                              }
                              if (ContextCompat.checkSelfPermission(activity, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) {
                                  needed.add(Manifest.permission.BLUETOOTH_SCAN);
                              }
                              if (!needed.isEmpty()) {
                                  ActivityCompat.requestPermissions(activity, needed.toArray(new String[0]), 7501);
                                  return false;
                              }
                          }
                          return true;
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  @JavascriptInterface
                  public String getPairedDevicesJson() {
                      try {
                          if (!checkAndRequestPermissions()) return "PERMISSION_REQUIRED";
                          BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                          if (adapter == null) return "NO_BLUETOOTH";
                          if (!adapter.isEnabled()) {
                              try {
                                  activity.startActivityForResult(new Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE), 7502);
                              } catch (Exception ignored) {}
                              return "BLUETOOTH_OFF";
                          }
                          Set<BluetoothDevice> paired = adapter.getBondedDevices();
                          JSONArray arr = new JSONArray();
                          if (paired != null) {
                              for (BluetoothDevice dev : paired) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("name", dev.getName() != null ? dev.getName() : "750W-S2290");
                                  obj.put("address", dev.getAddress());
                                  arr.put(obj);
                              }
                          }
                          return arr.toString();
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }

                  private BluetoothSocket connectBluetoothSocketWithFallback(BluetoothDevice device) throws Exception {
                      BluetoothSocket socket = null;
                      try {
                          socket = device.createRfcommSocketToServiceRecord(SPP_UUID);
                          socket.connect();
                          return socket;
                      } catch (Exception e1) {
                          try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                      }
                      try {
                          socket = device.createInsecureRfcommSocketToServiceRecord(SPP_UUID);
                          socket.connect();
                          return socket;
                      } catch (Exception e2) {
                          try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                      }
                      Method m = device.getClass().getMethod("createRfcommSocket", new Class[]{int.class});
                      socket = (BluetoothSocket) m.invoke(device, 1);
                      socket.connect();
                      return socket;
                  }

                  @JavascriptInterface
                  public String printRawBase64Bluetooth(String macAddress, String base64Data) {
                      BluetoothSocket socket = null;
                      try {
                          if (!checkAndRequestPermissions()) return "PERMISSION_REQUIRED";
                          BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                          if (adapter == null || !adapter.isEnabled()) return "BLUETOOTH_OFF";
                          try { adapter.cancelDiscovery(); } catch (Exception ignored) {}

                          BluetoothDevice targetDevice = null;
                          if (macAddress != null && !macAddress.trim().isEmpty() && !macAddress.equals("AUTO")) {
                              targetDevice = adapter.getRemoteDevice(macAddress.trim());
                          } else {
                              Set<BluetoothDevice> paired = adapter.getBondedDevices();
                              if (paired != null) {
                                  for (BluetoothDevice dev : paired) {
                                      String addr = (dev.getAddress() != null ? dev.getAddress() : "").toUpperCase();
                                      String nm = (dev.getName() != null ? dev.getName() : "").toLowerCase();
                                      if (addr.equals(DEFAULT_DELI_MAC) || nm.contains("750w") || nm.contains("2290") || nm.contains("deli")) {
                                          targetDevice = dev;
                                          break;
                                      }
                                  }
                              }
                              if (targetDevice == null) {
                                  targetDevice = adapter.getRemoteDevice(DEFAULT_DELI_MAC);
                              }
                          }

                          if (targetDevice == null) return "NO_PAIRED_PRINTER";

                          byte[] rawBytes = Base64.decode(base64Data, Base64.DEFAULT);
                          socket = connectBluetoothSocketWithFallback(targetDevice);
                          OutputStream os = socket.getOutputStream();

                          int chunkSize = 1024;
                          for (int i = 0; i < rawBytes.length; i += chunkSize) {
                              int len = Math.min(chunkSize, rawBytes.length - i);
                              os.write(rawBytes, i, len);
                              os.flush();
                              Thread.sleep(6);
                          }
                          os.flush();
                          Thread.sleep(350);
                          socket.close();
                          return "OK:" + (targetDevice.getName() != null ? targetDevice.getName() : DEFAULT_DELI_MAC);
                      } catch (Exception e) {
                          try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                          return "ERROR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String printRawBase64Usb(String base64Data) {
                      try {
                          UsbManager usbManager = (UsbManager) activity.getSystemService(Context.USB_SERVICE);
                          if (usbManager == null) return "NO_USB_SERVICE";
                          HashMap<String, UsbDevice> deviceList = usbManager.getDeviceList();
                          if (deviceList == null || deviceList.isEmpty()) return "NO_USB_DEVICE";

                          UsbDevice printerDevice = deviceList.values().iterator().next();
                          if (!usbManager.hasPermission(printerDevice)) {
                              int flags = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                              PendingIntent pi = PendingIntent.getBroadcast(activity, 0, new Intent(ACTION_USB_PERMISSION), flags);
                              usbManager.requestPermission(printerDevice, pi);
                              return "USB_PERMISSION_REQUESTED";
                          }

                          UsbInterface targetInterface = null;
                          UsbEndpoint targetEndpoint = null;
                          for (int i = 0; i < printerDevice.getInterfaceCount(); i++) {
                              UsbInterface usbIf = printerDevice.getInterface(i);
                              for (int j = 0; j < usbIf.getEndpointCount(); j++) {
                                  UsbEndpoint ep = usbIf.getEndpoint(j);
                                  if (ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.getDirection() == UsbConstants.USB_DIR_OUT) {
                                      targetInterface = usbIf;
                                      targetEndpoint = ep;
                                      break;
                                  }
                              }
                              if (targetEndpoint != null) break;
                          }
                          if (targetInterface == null || targetEndpoint == null) return "NO_USB_PRINTER_ENDPOINT";

                          byte[] rawBytes = Base64.decode(base64Data, Base64.DEFAULT);
                          UsbDeviceConnection connection = usbManager.openDevice(printerDevice);
                          if (connection == null) return "USB_OPEN_FAILED";

                          connection.claimInterface(targetInterface, true);
                          int chunkSize = 4096;
                          for (int i = 0; i < rawBytes.length; i += chunkSize) {
                              int len = Math.min(chunkSize, rawBytes.length - i);
                              byte[] chunk = new byte[len];
                              System.arraycopy(rawBytes, i, chunk, 0, len);
                              if (connection.bulkTransfer(targetEndpoint, chunk, len, 4000) < 0) {
                                  connection.releaseInterface(targetInterface);
                                  connection.close();
                                  return "USB_TRANSFER_ERROR";
                              }
                          }
                          connection.releaseInterface(targetInterface);
                          connection.close();
                          return "OK:USB";
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public void triggerAndroidSystemPrint(final String jobName) {
                      activity.runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager pm = (PrintManager) activity.getSystemService(Context.PRINT_SERVICE);
                                  if (pm != null && webView != null) {
                                      String name = (jobName != null && !jobName.isEmpty()) ? jobName : "Sman_Hehya_Waybill";
                                      PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(name);
                                      pm.print(name, adapter, new PrintAttributes.Builder().build());
                                  }
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build 1 - Main Sman CRM APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sman-CRM-APK.apk

      - name: Build 2 - Standalone Sman Printer Studio APK (printer.html)
        run: |
          if [ -f "www/printer.html" ]; then
            cp -f www/printer.html android/app/src/main/assets/public/index.html
            sed -i 's/applicationId "com.smanhehya.crm"/applicationId "com.smanhehya.printer"/g' android/app/build.gradle
            sed -i 's/سمان ههيا CRM/مطبعة سمان ههيا/g' android/app/src/main/res/values/strings.xml || true
            cd android
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Sman-Printer-750W-APK.apk
          fi

      - name: Upload Main CRM APK
        uses: actions/upload-artifact@v4
        with:
          name: Sman-CRM-APK
          path: Sman-CRM-APK.apk

      - name: Upload Standalone Printer Studio APK
        if: hashFiles('Sman-Printer-750W-APK.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Sman-Printer-750W-APK
          path: Sman-Printer-750W-APK.apk
